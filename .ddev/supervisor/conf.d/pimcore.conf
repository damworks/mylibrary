[program:pimcore-system]
command=php -dmemory_limit=-1 /var/www/html/bin/console messenger:consume pimcore_core pimcore_maintenance pimcore_scheduled_tasks pimcore_image_optimize pimcore_search_backend_message --memory-limit=250M --time-limit=3600
numprocs=2
startsecs=0
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
#stdout_logfile=/dev/fd/1
#stdout_logfile_maxbytes=0
stdout_logfile=/var/log/supervisor/pimcore-system.log
stderr_logfile=/var/log/supervisor/pimcore-system.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=false

[program:consume-asset-update]
command=php /var/www/html/bin/console messenger:consume pimcore_asset_update --memory-limit=250M --time-limit=3600
numprocs=1
startsecs=0
autostart=true
autorestart=true
process_name=%(program_name)s_%(process_num)02d
#stdout_logfile=/dev/fd/1
#stdout_logfile_maxbytes=0
stdout_logfile=/var/log/supervisor/pimcore_asset_update.log
stderr_logfile=/var/log/supervisor/pimcore_asset_update.err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=false

[program:maintenance]
command=bash -c 'sleep 3600 && exec php /var/www/html/bin/console pimcore:maintenance'
autostart=true
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=false